name: 'Set up node & dependencies'
description: 'Sets up a typical Node repo with caching'

inputs:
  cache:
    description: 'Enable pnpm and build-artifact caching. Set to "false" for release workflows to mitigate cache poisoning'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v6
      with:
        node-version-file: 'package.json'
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    - if: inputs.cache == 'true'
      uses: actions/cache@v5
      with:
        path: |
          **/.jest-cache
          **/.eslintcache
          **/.parcel-cache
          **/*.tsbuildinfo
          **/lib
          **/dist
        key: ${{ runner.os }}-build-artifacts-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml', '**/tsconfig*.json') }}
        restore-keys: |
          ${{ runner.os }}-build-artifacts-
    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prod=false

name: Cut a Release
on:
  workflow_dispatch:
    inputs:
      package:
        description: Name of the package to release
        required: true
        type: choice
        options:
          - constants
          - custom-question-api
          - eslint-config
          - react-embed
          - tsconfig
          - web-embed-api
          - embed-messaging-manager
      version:
        description: Version to release
        required: true
env:
  GIT_COMMITTER_NAME: Formsort Release Bot
  GIT_AUTHOR_NAME: Formsort Release Bot
  EMAIL: releases+github@formsort.com
jobs:
  prepare_and_publish:
    runs-on: ubuntu-latest
    name: 'Publish a new version'
    environment: release
    permissions:
      id-token: write # Needed by craft for npm OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FS_RELEASE_GITHUB_PAT }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          # Disable caching for release workflows to prevent cache poisoning
          cache: 'false'
      - name: Publish with Craft
        env:
          GITHUB_TOKEN: ${{ secrets.FS_RELEASE_GITHUB_PAT }}
          CRAFT_LOG_LEVEL: ${{ secrets.CRAFT_LOG_LEVEL }}
        run: |
          pnpm --filter @formsort/${{ github.event.inputs.package }} exec craft prepare --publish ${{ github.event.inputs.version }}
